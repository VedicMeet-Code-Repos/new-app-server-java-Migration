version: 0.2

phases:
  install:
    commands:
      - echo "Installing Maven..."
      - apt-get update -y || yum update -y || true
      - apt-get install -y maven || yum install -y maven || true
      - mvn --version

  pre_build:
    commands:
      - echo "Starting build at $(date)"
      - java -version

  build:
    commands:
      - echo "Running Maven build"
      - mvn clean package -DskipTests

  post_build:
    commands:
      - echo "Build completed at $(date)"
      - ls -lh target/*.jar

artifacts:
  files:
    - target/*.jar
    - appspec.yml
    - scripts/**/*
  discard-paths: no
