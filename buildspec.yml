version: 0.2

phases:
  install:
    commands:
      - echo "Installing Maven..."
      - apt-get update -y || yum update -y || true
      - apt-get install -y maven || yum install -y maven || true
      - mvn --version

  pre_build:
    commands:
      - echo "Starting build at $(date)"
      - java -version

  build:
    commands:
      - echo "Running Maven build"
      - mvn clean package -DskipTests
      - echo "Renaming boot jar to vedicmeet.jar"
      # Rename the versioned Spring Boot jar to the stable name the systemd
      # unit expects (/opt/vedicmeet/vedicmeet.jar). Exclude the *.original
      # produced by the Spring Boot repackage goal.
      - BOOT_JAR="$(ls target/*.jar | grep -v '\.original$' | head -n1)"
      - echo "Found boot jar: $BOOT_JAR"
      - cp "$BOOT_JAR" target/vedicmeet.jar

  post_build:
    commands:
      - echo "Build completed at $(date)"
      - ls -lh target/vedicmeet.jar

artifacts:
  files:
    - target/vedicmeet.jar
    - appspec.yml
    - scripts/**/*
  discard-paths: no
